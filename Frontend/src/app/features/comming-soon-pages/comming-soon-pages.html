<div class="coming-soon-wrapper d-flex flex-column align-items-center justify-content-center text-center px-3">
  <div class="coming-soon-icon mb-4">
    <i class="fa-solid fa-clock"></i>
  </div>

  <h1 class="coming-soon-title mb-2">Coming Soon</h1>
  <p class="coming-soon-subtitle mb-4">
    This page is currently under development and will be available shortly.
  </p>

  <div class="coming-soon-badge mb-4">
    <span class="badge">{{ pageName || 'Feature' }}</span>
  </div>

  <button class="btn btn-coming-soon" (click)="goBack()">
    <i class="bi bi-arrow-left me-2"></i> Back to Dashboard
  </button>
</div>
