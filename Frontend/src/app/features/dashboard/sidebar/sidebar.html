<aside class="dashboard-sidebar d-flex flex-column flex-shrink-0 bg-white border-end shadow-sm">

  <nav class="pb-3">

    <ul class="nav nav-pills flex-column gap-1 mt-2">
      <li class="nav-item">
        <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link d-flex align-items-center gap-2">
          <i class="bi bi-house-door"></i>
          <span>Dashboard</span>
        </a>
      </li>

      <li class="nav-item">
        <a routerLink="/dashboard/register-property" routerLinkActive="active" class="nav-link d-flex align-items-center gap-2">
          <i class="bi bi-file-earmark-plus"></i>
          <span>Register Property</span>
        </a>
      </li>

      <li class="nav-item">
        <a routerLink="/dashboard/property-bidder-registration" routerLinkActive="active" class="nav-link d-flex align-items-center gap-2">
          <i class="bi bi-card-checklist"></i>
          <span>Bidder Registration</span>
        </a>
      </li>

    </ul>
  </nav>

  <div class="mt-auto p-3">
    <a routerLink="/login" class="btn btn-light border text-danger w-100 rounded-pill">
      <i class="bi bi-box-arrow-right me-2"></i>
      Logout
    </a>
  </div>
</aside>
