<div class="profile-wrapper py-4 bg-light">
  <div class="container">
    <div class="profile-card shadow-sm rounded-4 overflow-hidden">
      <div class="profile-card-header d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3 p-4 p-md-5 border-bottom">
        <div class="d-flex align-items-center gap-3">
          <div class="avatar-container">
            <img [src]="user.avatarUrl" alt="Profile Image" class="profile-avatar">
            <button type="button" class="avatar-edit-btn" (click)="fileInput.click()" title="Update Image">
              <i class="bi bi-pencil-fill"></i>
            </button>
            <input #fileInput type="file" (change)="onAvatarChange($event)" class="d-none" accept="image/*">
          </div>
          <div>
            <h2 class="h4 mb-1 fw-semibold text-dark">{{ user.name || 'User Profile' }}</h2>
            <p class="mb-0 text-muted small">{{ user.email }}</p>
          </div>
        </div>

        <div class="d-flex gap-2">
          <button type="button" class="btn btn-outline-success btn-sm" (click)="changePassword()">
            <i class="bi bi-key me-2"></i>Change Password
          </button>
          <button type="button" class="btn btn-outline-secondary btn-sm" (click)="resetForm()">
            Reset
          </button>
        </div>
      </div>

      <div class="profile-card-body p-4 p-md-5">
        <form (ngSubmit)="saveProfile()" #profileForm="ngForm">
          <div class="row g-4">
            <div class="col-md-6">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control minimal-input" name="name" [(ngModel)]="user.name" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control minimal-input" name="email" [(ngModel)]="user.email" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Mobile No.</label>
              <input type="tel" class="form-control minimal-input" name="mobile" [(ngModel)]="user.mobile" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">Alternate Contact No.</label>
              <input type="tel" class="form-control minimal-input" name="altMobile" [(ngModel)]="user.altMobile">
            </div>

            <div class="col-12 mt-4">
              <h3 class="h6 text-success text-uppercase mb-3">Address Details</h3>
            </div>

            <div class="col-12">
              <label class="form-label">Street Address</label>
              <input type="text" class="form-control minimal-input" name="address" [(ngModel)]="user.address" required>
            </div>

            <div class="col-md-4">
              <label class="form-label">City</label>
              <input type="text" class="form-control minimal-input" name="city" [(ngModel)]="user.city" required>
            </div>

            <div class="col-md-4">
              <label class="form-label">District</label>
              <input type="text" class="form-control minimal-input" name="district" [(ngModel)]="user.district" required>
            </div>

            <div class="col-md-4">
              <label class="form-label">State</label>
              <input type="text" class="form-control minimal-input" name="state" [(ngModel)]="user.state" required>
            </div>

            <div class="col-md-4">
              <label class="form-label">Pincode</label>
              <input type="text" class="form-control minimal-input" name="pincode" [(ngModel)]="user.pincode" required>
            </div>

            <div class="col-12 mt-4 pt-3 border-top d-flex justify-content-end">
              <button type="submit" class="btn btn-success px-5" [disabled]="!profileForm.valid">
                Save Profile Changes
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
