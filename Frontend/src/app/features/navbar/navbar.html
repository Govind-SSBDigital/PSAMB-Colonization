<nav class="premium-navbar">
  <div class="container-fluid nav-flex-container">

    <!-- Branding Logo & Titles -->
    <a class="nav-branding-wrap">
      <div class="branding-logo">
        <img src="/ColonizationLogo.png" alt="PSLPCB Punjab Logo" class="logo-img"
          style="filter: brightness(0) invert(1); opacity: 0.9;" />
      </div>
      <div class="branding-text-block">
        <h1 class="main-title">Director Colonization Punjab</h1>
        <span class="sub-title">Property &amp; e-Auction Portal</span>
      </div>
    </a>

    <!-- Nav Links (Responsive Collapse) -->
    <div class="nav-links-container" [class.mobile-open]="isMobileMenuOpen">
      <a class="nav-link-item" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
        (click)="closeMobileMenu()">Home</a>
      <a class="nav-link-item" routerLinkActive="active" (click)="closeMobileMenu()">e-Auctions</a>
      <a class="nav-link-item" routerLinkActive="active" (click)="closeMobileMenu()">Citizen
        Services</a>

      <a class="nav-link-item" (click)="clickMessages($event)">Messages</a>

      <a class="nav-link-item" href="#introduction" (click)="closeMobileMenu()">About Us</a>
      <!-- Downloads Dropdown Menu -->
      <div class="nav-dropdown-wrapper" [class.dropdown-open]="isDownloadsDropdownOpen">
        <a class="nav-link-item dropdown-toggle" (click)="toggleDownloadsDropdown($event)">
          Downloads <i class="fas fa-chevron-down dropdown-arrow" [class.rotated]="isDownloadsDropdownOpen"></i>
        </a>
        <div class="nav-dropdown-menu" [class.show]="isDownloadsDropdownOpen">
          <a class="dropdown-item" href="/downloads/ndc_requirements.txt" download (click)="closeMobileMenu(); isDownloadsDropdownOpen = false">
            <i class="fas fa-file-invoice icon-dropdown"></i> Documents for NDC
          </a>
          <a class="dropdown-item" href="/downloads/permission_to_sell_requirements.txt" download (click)="closeMobileMenu(); isDownloadsDropdownOpen = false">
            <i class="fas fa-file-signature icon-dropdown"></i> Permission to Sell
          </a>
          <a class="dropdown-item" href="/downloads/permission_to_transfer_death_case.txt" download (click)="closeMobileMenu(); isDownloadsDropdownOpen = false">
            <i class="fas fa-users-slash icon-dropdown"></i> Permission to Transfer
          </a>
        </div>
      </div>

      <!-- CTA Auth Buttons in mobile/collapsed view -->
      <!-- <div class="nav-actions-mobile mt-3">
        <a class="btn-nav-login" routerLink="/login" [queryParams]="{mode: 'signin'}"
          (click)="closeMobileMenu()">Sign In</a>
        <a class="btn-nav-register" routerLink="/login" [queryParams]="{mode: 'signup'}"
          (click)="closeMobileMenu()">Sign Up</a>
      </div> -->
    </div>

    <!-- Desktop CTA Buttons -->
    <div class="nav-actions-desktop">
      <a class="btn-nav-login" routerLink="/auth/login">Sign In</a>
      <a class="btn-nav-login" routerLink="/auth/register">Sign Up</a>
    </div>

    <!-- Mobile Menu Toggler Toggle -->
    <button class="nav-mobile-toggle" (click)="toggleMobileMenu()" aria-label="Toggle Navigation">
      <i class="fas" [class.fa-bars]="!isMobileMenuOpen" [class.fa-times]="isMobileMenuOpen"></i>
    </button>
  </div>
</nav>
