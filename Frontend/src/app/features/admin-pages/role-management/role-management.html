<div class="role-management">

    <div
        class="page-header d-flex flex-wrap justify-content-between align-items-center px-3 px-md-4 py-3 bg-white border-bottom rounded-top-3 shadow-sm">
        <div class="header-title">
            <h1 class="mb-0 text-success">Role Management</h1>
            <span class="text-muted small">{{ totalRecords }} roles</span>
        </div>

        <div class="header-actions d-flex gap-2">
            <button type="button" class="btn btn-filter d-flex align-items-center gap-2" [class.active]="showFilters"
                (click)="toggleFilters()" aria-controls="filterBar" [attr.aria-expanded]="showFilters">
                <mat-icon class="icon-sm">tune</mat-icon>
                Filters
            </button>

            <button type="button" class="btn btn-add d-flex align-items-center gap-2" (click)="addNewUser()">
                <mat-icon class="icon-sm">add</mat-icon>
                Add New Role
            </button>
        </div>
    </div>

    <div class="filter-bar-wrapper" [class.open]="showFilters">
        <div id="filterBar" class="filter-bar px-3 py-3 px-md-4 bg-white border-bottom">
            <div class="row g-2 align-items-center">

                <div class="col-12 col-md-5 col-lg-3">
                    <div class="input-group input-group-sm search-group border rounded-3">
                        <input type="text" class="form-control p-2" placeholder="Search by Hrms Code / User ID"
                            [(ngModel)]="searchTerm" />
                       <span class="input-group-text bg-white">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    </span>
                    </div>
                </div>

                <div class="col-6 col-md-3 col-lg-3">
                    <div class="filter-select-wrapper">
                        <select class="form-select form-select-sm border-1 rounded-3 p-2 custom-input-color"
                            [(ngModel)]="selectedDistrict">
                            <option value="All">Districts</option>
                            <option *ngFor="let d of districtList" [value]="d">{{ d }}</option>
                        </select>
                    </div>
                </div>

                <div class="col-12 col-md-1 col-lg-3">
                    <div class="filter-select-wrapper">
                        <select class="form-select form-select-sm border-1 rounded-3 p-2 custom-input-color"
                            [(ngModel)]="selectedMarketCommittee">
                            <option value="All">Market Committees</option>
                            <option *ngFor="let m of marketCommitteeList" [value]="m">{{ m }}</option>
                        </select>
                    </div>
                </div>

                <div class="col-6 col-md-3 col-lg-3">
                    <div class="filter-select-wrapper">
                        <select class="form-select form-select-sm border-1 rounded-3 p-2 custom-input-color"
                            [(ngModel)]="selectedMandi">
                            <option value="All">Mandis</option>
                            <option *ngFor="let m of mandiList" [value]="m">{{ m }}</option>
                        </select>
                    </div>
                </div>

            </div>

            <div class="d-flex justify-content-end mt-1">
                <button type="button" class="btn btn-link btn-reset p-0" (click)="resetFilters()">
                    Reset filters
                </button>
            </div>
        </div>
    </div>

    <div class="card-body p-0 bg-surface">
        <div class="table-wrapper">
            <div class="table-responsive table-scroll">
                <table class="table table-hover align-middle mb-0 table-verification">
                    <thead class="table-head-portal">
                        <tr>
                            <th scope="col">HRMS Code / User ID</th>
                            <th scope="col">Name</th>
                            <th scope="col">Role</th>
                            <th scope="col" class="text-center">Status</th>
                            <th scope="col" class="text-center" style="width: 110px">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let user of users">
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <span class="fw-bold text-success">{{ user.hrmsCode }}</span>
                                </div>
                            </td>

                            <td>
                                <div class="user-cell d-flex align-items-center gap-2">
                                    <!-- <div class="avatar-circle">{{ user.name.charAt(0) }}</div> -->
                                    <div class="d-flex flex-column">
                                        <span class="fw-semibold text-secondary">{{ user.name }}</span>
                                        <span class="text-muted small">{{ user.email }}</span>
                                    </div>
                                </div>
                            </td>

                            <td>
                                <span class="role-badge role-admin rounded-4">
                                    {{ user.role }}
                                </span>
                            </td>

                            <td class="text-center">
                                <span class="status-badge"
                                    [ngClass]="user.status === 'Active' ? 'status-active' : 'status-inactive'">
                                    <span class="status-dot"></span>{{ user.status }}
                                </span>
                            </td>

                            <td class="text-center">
                                <div class="action-stack d-flex justify-content-center gap-2">
                                    <button type="button" class="btn btn-action-icon text-success"
                                        matTooltip="View Details" matTooltipPosition="above">
                                        <mat-icon class="icon-sm">visibility</mat-icon>
                                    </button>
                                    <button type="button" class="btn btn-action-icon text-danger" matTooltip="Delete"
                                        matTooltipPosition="above">
                                        <mat-icon class="icon-sm">delete</mat-icon>
                                    </button>
                                </div>
                            </td>
                        </tr>

                        <tr *ngIf="users.length === 0">
                            <td colspan="5" class="text-center py-4 text-muted">
                                <mat-icon class="mb-2 d-block mx-auto empty-icon">layers_clear</mat-icon>
                                No roles found matching your criteria.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-3 border-0 rounded-3 bg-white shadow-sm">
        <mat-paginator [length]="totalRecords" [pageSize]="pageSize" [pageSizeOptions]="[10, 20, 50, 100]"
            [pageIndex]="pageIndex" (page)="onPageChange($event)">
        </mat-paginator>
    </div>

</div>
