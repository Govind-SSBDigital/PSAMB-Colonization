<div class="step-form-block">
    <div class="step-green-header collapsible-header" (click)="toggleSection('documents')">
        <span><i class="fas fa-folder-open"></i> &nbsp; {{ getDocumentsTitle() }}</span>
        <i class="fas section-toggle-icon" [class.fa-angle-up]="sectionsExpanded.documents"
            [class.fa-angle-down]="!sectionsExpanded.documents"></i>
    </div>

    <div class="collapsible-content" [class.collapsed]="!sectionsExpanded.documents">
        <div class="wizard-form-grid mb-4">
            <!-- Select Identification Document -->
            <div class="form-group-custom">
                <label class="form-label-custom">Select Identification Document (ਪਛਾਣ ਦਸਤਾਵੇਜ਼ ਚੁਣੋ)
                    <span class="required-star">*</span></label>
                <select name="idDocumentType" [(ngModel)]="signUpData.idDocumentType" class="form-input-custom">
                    <option value="" disabled selected>Select Document</option>
                    <option *ngFor="let doc of idDocTypes" [value]="doc">{{ doc }}</option>
                </select>
            </div>

            <!-- Number -->
            <div class="form-group-custom">
                <label class="form-label-custom">Number (ਨੰਬਰ) <span class="required-star">*</span></label>
                <input type="text" name="idDocumentNumber" [(ngModel)]="signUpData.idDocumentNumber"
                    class="form-input-custom" placeholder="Enter Document Number">
            </div>

            <!-- Upload Document -->
            <div class="form-group-custom">
                <label class="form-label-custom">Upload Document (ਦਸਤਾਵੇਜ਼ ਅਪਲੋਡ ਕਰੋ) <span class="required-star">*</span></label>
                <div class="custom-file-wrapper">
                    <div class="choose-file-container">
                        <button type="button" class="choose-file-btn" (click)="idDocInput.click()">Choose File</button>
                        <span class="file-chosen-text" [class.text-muted]="!signUpData.idDocumentFileName">{{
                            signUpData.idDocumentFileName || 'No file chosen' }}</span>
                        <input #idDocInput type="file" (change)="emitFileSelected($event, 'idDoc')" class="d-none">
                    </div>
                    <div class="progress-bar-inline" *ngIf="uploadingStates['idDoc']">
                        <div class="p-fill" [style.width.%]="uploadProgress['idDoc']"></div>
                    </div>
                </div>
            </div>

            <!-- Upload Your Photo -->
            <div class="form-group-custom">
                <label class="form-label-custom">Upload Your Photo (ਆਪਣੀ ਫੋਟੋ ਅਪਲੋਡ ਕਰੋ) <span class="required-star">*</span></label>
                <div class="custom-file-wrapper">
                    <div class="choose-file-container">
                        <button type="button" class="choose-file-btn" (click)="photoInput.click()">Choose File</button>
                        <span class="file-chosen-text" [class.text-muted]="!signUpData.photoFileName">{{
                            signUpData.photoFileName || 'No file chosen' }}</span>
                        <input #photoInput type="file" (change)="emitFileSelected($event, 'photo')" class="d-none">
                    </div>
                    <div class="progress-bar-inline" *ngIf="uploadingStates['photo']">
                        <div class="p-fill" [style.width.%]="uploadProgress['photo']"></div>
                    </div>
                </div>
            </div>

            <div class="form-group-custom full-width" *ngIf="signUpData.idDocumentType === 'Aadhaar Card'">
                <label class="checkbox-container-custom">
                    <input type="checkbox" name="shareAadhaarDetails" [(ngModel)]="signUpData.shareAadhaarDetails">
                    <span>I am willing to share my Aadhaar details with the website</span>
                </label>
            </div>
        </div>

        <!-- Address Subheader -->
        <div class="step-green-header-inner text-success">
            <i class="fas fa-map-marker-alt"></i> &nbsp; {{ getAddressTitle() }}
        </div>

        <div class="wizard-form-grid">
            <!-- State -->
            <div class="form-group-custom">
                <label class="form-label-custom">State (ਰਾਜ) <span class="required-star">*</span></label>
                <select name="addressState" [(ngModel)]="signUpData.addressState" class="form-input-custom">
                    <option value="" disabled selected>---Select State---</option>
                    <option *ngFor="let s of states" [value]="s">{{ s }}</option>
                </select>
            </div>

            <!-- District -->
            <div class="form-group-custom">
                <label class="form-label-custom">District (ਜ਼ਿਲ੍ਹਾ) <span class="required-star">*</span></label>
                <select name="addressDistrict" [(ngModel)]="signUpData.addressDistrict" class="form-input-custom">
                    <option value="" disabled selected>---Select District---</option>
                    <option *ngFor="let d of districts" [value]="d">{{ d }}</option>
                </select>
            </div>

            <!-- City -->
            <div class="form-group-custom">
                <label class="form-label-custom">City (ਸ਼ਹਿਰ) <span class="required-star">*</span></label>
                <select name="addressCity" [(ngModel)]="signUpData.addressCity" class="form-input-custom">
                    <option value="" disabled selected>---Select City---</option>
                    <option *ngFor="let c of cities" [value]="c">{{ c }}</option>
                </select>
            </div>

            <!-- Pin Code -->
            <div class="form-group-custom">
                <label class="form-label-custom">Pin Code (ਪਿੰਨ ਕੋਡ) <span class="required-star">*</span></label>
                <input type="text" name="addressPincode" maxlength="6" [(ngModel)]="signUpData.addressPincode"
                    class="form-input-custom" placeholder="Enter Pin Code">
            </div>

            <!-- Plot No/Street No/Landmark -->
            <div class="form-group-custom full-width">
                <label class="form-label-custom">Plot No/Street No/Landmark(If any) (ਪਲਾਟ ਨੰਬਰ/ਗਲੀ
                    ਨੰਬਰ/ਲੈਂਡਮਾਰਕ (ਜੇ ਕੋਈ
                    ਹੋਵੇ)) <span class="required-star">*</span></label>
                <textarea rows="2" name="addressLandmark" [(ngModel)]="signUpData.addressLandmark" class="form-input-custom"
                    placeholder="Enter Plot No/Street No/Landmark(If any)"></textarea>
            </div>

            <!-- Select Address Document -->
            <div class="form-group-custom">
                <label class="form-label-custom">Select Address Document (ਪਤਾ ਦਸਤਾਵੇਜ਼ ਚੁਣੋ) <span class="required-star">*</span></label>
                <select name="addressDocType" [(ngModel)]="signUpData.addressDocType" class="form-input-custom">
                    <option value="" disabled selected>Select Document</option>
                    <option *ngFor="let doc of addressDocTypes" [value]="doc">{{ doc }}</option>
                </select>
            </div>

            <!-- Number -->
            <div class="form-group-custom">
                <label class="form-label-custom">Number (ਨੰਬਰ) <span class="required-star">*</span></label>
                <input type="text" name="addressDocNumber" [(ngModel)]="signUpData.addressDocNumber" class="form-input-custom"
                    placeholder="Enter Address Proof Number">
            </div>

            <!-- Upload Document -->
            <div class="form-group-custom">
                <label class="form-label-custom">Upload Document (ਦਸਤਾਵੇਜ਼ ਅਪਲੋਡ ਕਰੋ) <span class="required-star">*</span></label>
                <div class="custom-file-wrapper">
                    <div class="choose-file-container">
                        <button type="button" class="choose-file-btn" (click)="addressDocInput.click()">Choose File</button>
                        <span class="file-chosen-text" [class.text-muted]="!signUpData.addressDocFileName">{{
                            signUpData.addressDocFileName || 'No file chosen' }}</span>
                        <input #addressDocInput type="file" (change)="emitFileSelected($event, 'addressDoc')" class="d-none">
                    </div>
                    <div class="progress-bar-inline" *ngIf="uploadingStates['addressDoc']">
                        <div class="p-fill" [style.width.%]="uploadProgress['addressDoc']"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
