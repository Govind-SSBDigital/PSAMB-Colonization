name: CD / Deploy Staging

on:
  push:
    branches:
      - staging

jobs:
  build-staging:
    name: Build & Package (Staging / UAT)
    runs-on: ubuntu-latest
    environment: Staging

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Setup .NET & Node
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: Frontend/package-lock.json

    # Build and Publish Backend
    - name: Restore & Build Backend
      run: |
        dotnet restore Backend/Backend.csproj
        dotnet build Backend/Backend.csproj --no-restore --configuration Release

    - name: Run Backend Tests
      run: dotnet test Backend/Backend.csproj --no-build --configuration Release

    - name: Publish Backend
      run: dotnet publish Backend/Backend.csproj -c Release -o ./publish-backend

    # Build Frontend
    - name: Install Frontend Dependencies
      run: npm ci
      working-directory: Frontend

    - name: Build Frontend (Staging)
      run: npm run build -- --configuration=production
      working-directory: Frontend

    # Generate EF Core Migration Script (for manual DB updates)
    - name: Install EF Tool
      run: dotnet tool install --global dotnet-ef

    - name: Generate Migration SQL Script
      run: dotnet ef migrations script --project Backend/Backend.csproj --idempotent --output ./migration-staging.sql
      continue-on-error: true

    # Upload build artifacts for manual deployment
    - name: Upload Backend Artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-staging-build
        path: ./publish-backend
        retention-days: 14

    - name: Upload Frontend Artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-staging-build
        path: ./Frontend/dist/
        retention-days: 14

    - name: Upload Migration Script
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: migration-script-staging
        path: ./migration-staging.sql
        retention-days: 14
        if-no-files-found: ignore
