name: CD / Deploy Develop

on:
  push:
    branches:
      - develop

jobs:
  build-develop:
    name: Build & Package (Dev)
    runs-on: ubuntu-latest
    environment: Local-Dev

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Setup .NET & Node
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: Frontend/package-lock.json

    # Build and Publish Backend
    - name: Restore & Build Backend
      run: |
        dotnet restore Backend/Backend.csproj
        dotnet build Backend/Backend.csproj --no-restore --configuration Release

    - name: Run Backend Tests
      run: dotnet test Backend/Backend.csproj --no-build --configuration Release

    - name: Publish Backend
      run: dotnet publish Backend/Backend.csproj -c Release -o ./publish-backend

    # Build Frontend
    - name: Install Frontend Dependencies
      run: npm ci
      working-directory: Frontend

    - name: Build Frontend (Development)
      run: npm run build -- --configuration=development
      working-directory: Frontend

    # Upload build artifacts for manual deployment
    - name: Upload Backend Artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-dev-build
        path: ./publish-backend
        retention-days: 7

    - name: Upload Frontend Artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dev-build
        path: ./Frontend/dist/
        retention-days: 7
