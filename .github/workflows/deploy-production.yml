name: CD / Deploy Production

on:
  push:
    branches:
      - main

jobs:
  build-production:
    name: Build & Package (Production)
    runs-on: ubuntu-latest
    # Freezes the pipeline here until approved by authorized reviewers in GitHub UI
    environment: Production

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Setup .NET & Node
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: Frontend/package-lock.json

    # Build and Publish Backend
    - name: Restore & Build Backend
      run: |
        dotnet restore Backend/Backend.csproj
        dotnet build Backend/Backend.csproj --no-restore --configuration Release

    - name: Run Backend Tests
      run: dotnet test Backend/Backend.csproj --no-build --configuration Release

    - name: Publish Backend
      run: dotnet publish Backend/Backend.csproj -c Release -o ./publish-backend

    # Build Frontend
    - name: Install Frontend Dependencies
      run: npm ci
      working-directory: Frontend

    - name: Build Frontend (Production)
      run: npm run build -- --configuration=production
      working-directory: Frontend

    # Generate EF Core Migration Script (for manual DB updates)
    - name: Install EF Tool
      run: dotnet tool install --global dotnet-ef

    - name: Generate Migration SQL Script
      run: dotnet ef migrations script --project Backend/Backend.csproj --idempotent --output ./migration-production.sql
      continue-on-error: true

    # Upload build artifacts for manual deployment
    - name: Upload Backend Artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-production-build
        path: ./publish-backend
        retention-days: 30

    - name: Upload Frontend Artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-production-build
        path: ./Frontend/dist/
        retention-days: 30

    - name: Upload Migration Script
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: migration-script-production
        path: ./migration-production.sql
        retention-days: 30
        if-no-files-found: ignore

    # Summary
    - name: Deployment Summary
      run: |
        echo "## 🚀 Production Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Build artifacts are ready for manual deployment." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Artifacts:" >> $GITHUB_STEP_SUMMARY
        echo "- **backend-production-build** — Published .NET API" >> $GITHUB_STEP_SUMMARY
        echo "- **frontend-production-build** — Angular production bundle" >> $GITHUB_STEP_SUMMARY
        echo "- **migration-script-production** — Idempotent SQL migration script" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Download artifacts from the Actions run page and deploy to your server." >> $GITHUB_STEP_SUMMARY
